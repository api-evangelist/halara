aid: halara
name: Halara
description: >-
  Halara is a direct-to-consumer athleisure and activewear fashion brand for
  women, best known for its versatile Active Dress and its Halara Flex fabric
  technology. Its Shopify-based online store sells exercise dresses, leggings,
  tennis skirts, joggers, pants, sports bras, loungewear, sweaters, and denim
  under the tagline "Athleisure for 365 Versions of You." Halara runs a mobile
  shopping app and a customer loyalty program (The Halara Circle), and is
  backed by Hongshan (formerly Sequoia Capital China). Halara publishes no
  public developer API; this API Evangelist profile captures the company's
  public web, brand, and policy properties for network discovery.
